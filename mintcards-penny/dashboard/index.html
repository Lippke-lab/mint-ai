<title>Penny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap">
<style>
  /* Bewusst ein einziges, dunkles Design (Jarvis-Look), unabhängig vom System-Theme. */
  :root {
    color-scheme: dark;
    --ink: #0a111d;
    --text: #e4ecf6;
    --muted: #8697b2;
    --faint: #56678a;
    --mint: #5ee6c0;
    --lilac: #9aa8ff;
    --gold: #f2c66d;
    --good: #7fd98f;
    --bad: #ff7d7d;
    --display: "Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
    --body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; background: var(--ink); }
  body {
    margin: 0;
    color: var(--text);
    font: 16px/1.5 var(--body);
    padding-inline: 16px;
    padding-block: 0;
    background:
      radial-gradient(900px 700px at 50% 42%, rgba(94, 230, 192, .08), transparent 65%),
      var(--ink);
    overflow: hidden;
  }
  .stage {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    justify-items: center;
    padding-block: 20px;
  }
  .wordmark {
    font: 700 22px/1 var(--display); letter-spacing: .5em; padding-left: .5em;
    background: linear-gradient(100deg, var(--mint), var(--lilac) 55%, var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .center { display: grid; place-items: center; align-content: center; gap: 6px; width: 100%; min-height: 0; }
  .orb-wrap { width: min(520px, 72vmin, 100%); aspect-ratio: 1; max-width: 100%; }
  #orb { width: 100%; height: 100%; display: block; }
  .state-label { font: 600 clamp(22px, 3.2vmin, 30px)/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; }
  .caption {
    max-width: 62ch; min-height: 3em; text-align: center; color: var(--muted);
    font-size: clamp(15px, 2vmin, 18px); line-height: 1.55; transition: opacity .6s ease;
    text-wrap: balance;
  }
  .caption.fade { opacity: .35; }
  .caption.err { color: var(--bad); }
  .foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; color: var(--faint); font-size: 13px; }
  .keys { display: inline-flex; gap: 6px; align-items: center; }
  kbd {
    font: 600 12px/1 var(--display); padding: 6px 8px; border-radius: 6px; color: var(--text);
    background: #152238; border: 1px solid #22324c; border-bottom-width: 2px;
  }
  .conn { display: inline-flex; align-items: center; gap: 7px; }
  .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .conn.live .dot { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .conn.demo { color: var(--gold); }
  .conn.demo .dot { background: var(--gold); }
  .conn.off .dot { background: var(--bad); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main class="stage">
  <div class="wordmark" aria-label="Penny">PENNY</div>

  <div class="center">
    <div class="orb-wrap"><canvas id="orb" width="1040" height="1040" aria-hidden="true"></canvas></div>
    <div class="state-label" id="state-label" aria-live="polite">Bereit</div>
    <p class="caption" id="caption"></p>
  </div>

  <div class="foot">
    <span class="keys" id="keys"><kbd>Q</kbd>+<kbd>E</kbd><span>halten zum Sprechen</span></span>
    <span class="conn" id="conn"><span class="dot"></span><span id="conn-text">Verbinde …</span></span>
  </div>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  const STATES = {
    bereit:   "Bereit",
    hoert_zu: "Hört zu",
    versteht: "Versteht",
    denkt:    "Denkt nach",
    spricht:  "Spricht",
    fehler:   "Störung",
  };

  const S = { mode: "verbinde", state: "bereit", detail: "", frage: "", antwort: "", taste: "Q + E" };

  // ---------------- Anzeige ----------------
  function renderConn() {
    const el = $("conn");
    el.className = "conn " + ({ live: "live", demo: "demo", getrennt: "off" }[S.mode] || "");
    $("conn-text").textContent = {
      live: "Live", demo: "Vorschau mit Beispielen", getrennt: "Verbindung getrennt", verbinde: "Verbinde …",
    }[S.mode];
  }

  function renderKeys() {
    const keys = $("keys");
    keys.replaceChildren();
    if (!S.taste || S.taste === "–") { keys.append("Mikrofon aus"); return; }
    S.taste.split("+").map((k) => k.trim()).filter(Boolean).forEach((k, i) => {
      if (i) keys.append("+");
      const kbd = document.createElement("kbd"); kbd.textContent = k; keys.append(kbd);
    });
    const span = document.createElement("span");
    span.textContent = S.taste === "Enter" ? "drücken zum Sprechen" : "halten zum Sprechen";
    keys.append(span);
  }

  // Untertitel: was du gesagt hast, während Penny nachdenkt; Pennys Antwort, während und nach dem Sprechen.
  function renderCaption() {
    const cap = $("caption");
    cap.classList.remove("err", "fade");
    if (S.state === "fehler") { cap.textContent = S.detail || "Etwas ist schiefgelaufen."; cap.classList.add("err"); return; }
    if (S.state === "hoert_zu") { cap.textContent = ""; return; }
    if (S.state === "versteht" || S.state === "denkt") { cap.textContent = S.frage ? `„${S.frage}“` : ""; return; }
    cap.textContent = S.antwort;
    if (S.state === "bereit") cap.classList.add("fade");
  }

  function render() {
    $("state-label").textContent = STATES[S.state] || STATES.bereit;
    orb.setState(S.state);
    renderCaption();
  }

  // ---------------- Verbindung zu Penny (localhost) oder Vorschau ----------------
  function applySnapshot(p) {
    S.state = p.state || "bereit";
    S.taste = (p.info && p.info.taste) || S.taste;
    const last = (p.turns || []).slice(-1)[0];
    if (last) { S.frage = last.frage; S.antwort = last.antwort; }
  }

  function connectEvents() {
    const es = new EventSource("/api/events");
    es.addEventListener("open", () => { S.mode = "live"; renderConn(); });
    es.addEventListener("error", () => { S.mode = "getrennt"; renderConn(); });
    es.addEventListener("status", (ev) => {
      const d = JSON.parse(ev.data); S.state = d.state; S.detail = d.detail || "";
      if (S.state === "hoert_zu") { S.frage = ""; S.antwort = ""; }
      render();
    });
    es.addEventListener("frage", (ev) => { S.frage = JSON.parse(ev.data).text; render(); });
    // Live-Untertitel: Pennys Antwort wächst mit, während Claude schreibt
    es.addEventListener("teil", (ev) => { S.antwort = JSON.parse(ev.data).text; if (S.state === "spricht") render(); });
    es.addEventListener("turn", (ev) => {
      const d = JSON.parse(ev.data); S.frage = d.frage; S.antwort = d.antwort; render();
    });
    es.addEventListener("gedaechtnis", () => { S.frage = ""; S.antwort = ""; render(); });
  }

  async function boot() {
    if (location.protocol.startsWith("http")) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 2000);
        const res = await fetch("/api/state", { cache: "no-store", signal: ctrl.signal });
        clearTimeout(timer);
        const data = res.ok ? await res.json() : null;
        if (data && data.penny) {
          applySnapshot(data.penny); S.mode = "live";
          renderConn(); renderKeys(); render(); connectEvents();
          return;
        }
      } catch (_) { /* keine lokale Penny: Vorschau */ }
    }
    S.mode = "demo"; renderConn(); renderKeys(); render();
    demoLoop();
  }

  // Vorschau: Beispiel-Ablauf in Schleife, damit man jeden Zustand einmal sieht
  const DEMO = [
    { frage: "Lohnt sich ein 151 Display für 120 Euro noch?",
      antwort: "Für ein versiegeltes 151 Display ist das ein solider Preis, wenn du länger halten willst. Für schnellen Weiterverkauf ist die Marge dünn." },
    { frage: "Wie verschicke ich Karten über 50 Euro?",
      antwort: "Ab 50 Euro immer mit Sendungsverfolgung. Karte im Toploader, zwischen zwei Pappen, im gepolsterten Umschlag." },
  ];
  function demoLoop() {
    let n = 0;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const set = (state, extra = {}) => { Object.assign(S, { state }, extra); render(); };
    (async function run() {
      await wait(1500);
      for (;;) {
        const ex = DEMO[n++ % DEMO.length];
        set("hoert_zu", { frage: "", antwort: "" }); await wait(2600);
        set("versteht", { frage: ex.frage }); await wait(900);
        set("denkt"); await wait(1700);
        set("spricht", { antwort: ex.antwort }); await wait(4200);
        set("bereit"); await wait(5000);
      }
    })();
  }

  // ---------------- Pennys Kern (Canvas) ----------------
  const orb = (() => {
    const canvas = $("orb"), ctx = canvas.getContext("2d");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const W = 520, C = W / 2, SCALE = canvas.width / W;
    const COLORS = { bereit: "#5ee6c0", hoert_zu: "#5ee6c0", versteht: "#9aa8ff", denkt: "#9aa8ff", spricht: "#f2c66d", fehler: "#ff7d7d" };
    let state = "bereit", energy = 0, target = 0, t0 = performance.now();

    function foil(r) {
      const g = ctx.createConicGradient ? ctx.createConicGradient(0, C, C) : ctx.createLinearGradient(0, 0, W, W);
      g.addColorStop(0, "#5ee6c0"); g.addColorStop(0.33, "#9aa8ff"); g.addColorStop(0.66, "#f2c66d"); g.addColorStop(1, "#5ee6c0");
      return g;
    }

    function draw(now) {
      const t = (now - t0) / 1000;
      energy += (target - energy) * 0.06;
      ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
      ctx.clearRect(0, 0, W, W);
      const col = COLORS[state] || COLORS.bereit;

      // Glühen
      const glow = ctx.createRadialGradient(C, C, 20, C, C, C);
      glow.addColorStop(0, col + "33"); glow.addColorStop(0.55, col + "10"); glow.addColorStop(1, "transparent");
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(C, C, C, 0, Math.PI * 2); ctx.fill();

      // äußere Skala (wie ein Messinstrument)
      ctx.save(); ctx.translate(C, C); ctx.rotate(reduce ? 0 : t * 0.05);
      for (let i = 0; i < 72; i++) {
        const a = (i / 72) * Math.PI * 2, long = i % 6 === 0;
        ctx.strokeStyle = long ? "rgba(228,236,246,.35)" : "rgba(228,236,246,.12)";
        ctx.lineWidth = long ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 232, Math.sin(a) * 232);
        ctx.lineTo(Math.cos(a) * (long ? 216 : 224), Math.sin(a) * (long ? 216 : 224));
        ctx.stroke();
      }
      ctx.restore();

      // Holo-Folienring
      ctx.lineWidth = 3; ctx.strokeStyle = foil();
      ctx.save(); ctx.translate(C, C); ctx.rotate(reduce ? 0 : -t * 0.15); ctx.translate(-C, -C);
      ctx.beginPath(); ctx.arc(C, C, 196, 0, Math.PI * 2); ctx.stroke(); ctx.restore();

      // Zustands-Bögen
      ctx.lineCap = "round";
      if (state === "denkt" || state === "versteht") {
        for (let k = 0; k < 3; k++) {
          const start = (reduce ? 0 : t * (1.6 + k * 0.5)) + k * 2.1;
          ctx.strokeStyle = col; ctx.globalAlpha = 0.85 - k * 0.22; ctx.lineWidth = 5 - k;
          ctx.beginPath(); ctx.arc(C, C, 168 - k * 18, start, start + 1.1 + k * 0.3); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      // Wellenring: Zuhören und Sprechen
      const waving = state === "hoert_zu" || state === "spricht";
      target = waving ? 1 : state === "bereit" ? 0.15 : 0.35;
      const base = 118 + (reduce ? 0 : Math.sin(t * 1.4) * 3);
      ctx.beginPath();
      for (let i = 0; i <= 180; i++) {
        const a = (i / 180) * Math.PI * 2;
        const wobble = reduce ? 0 :
          (Math.sin(a * 6 + t * 5) * 0.5 + Math.sin(a * 11 - t * 7.3) * 0.3 + Math.sin(a * 3 + t * 2.2) * 0.2) * 22 * energy;
        const r = base + wobble;
        const x = C + Math.cos(a) * r, y = C + Math.sin(a) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
      const fill = ctx.createRadialGradient(C, C, 10, C, C, base + 30);
      fill.addColorStop(0, col + "55"); fill.addColorStop(1, col + "08");
      ctx.fillStyle = fill; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();

      // Mitte: Monogramm
      ctx.fillStyle = "#e4ecf6"; ctx.globalAlpha = 0.9;
      ctx.font = "600 64px 'Chakra Petch', 'Segoe UI', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("P", C, C + 3); ctx.globalAlpha = 1;

      if (!reduce) requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
    return { setState(s) { state = s; if (reduce) requestAnimationFrame(draw); } };
  })();


  boot();
})();
</script>
