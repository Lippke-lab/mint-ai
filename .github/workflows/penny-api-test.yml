name: Penny API-Test

# Nur manuell starten (Actions-Tab → "Penny API-Test" → "Run workflow"),
# weil jeder Lauf ein paar Cent API-Guthaben kostet.
on:
  workflow_dispatch:
    inputs:
      question:
        description: "Testfrage an Penny (leer = Standardfrage)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mintcards-penny
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mintcards-penny/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Claude, TTS und STT testen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SMOKE_QUESTION: ${{ inputs.question }}
        run: python smoke_test.py --out smoke_output

      - name: Audiodatei hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penny-audio
          path: mintcards-penny/smoke_output/
          if-no-files-found: ignore
          retention-days: 7
