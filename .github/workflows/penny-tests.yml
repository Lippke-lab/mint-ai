name: Penny Tests

# Läuft bei jedem Push automatisch. Kostenlos: keine API-Keys, keine Soundkarte nötig.
on:
  push:
    paths: ["mintcards-penny/**", ".github/workflows/penny-tests.yml"]
  pull_request:
    paths: ["mintcards-penny/**", ".github/workflows/penny-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mintcards-penny
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mintcards-penny/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check --select E,F,W,B --line-length 110 .

      - name: Unit-Tests
        run: python -m pytest -q tests
